<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品列表：computed 小演示</title>
    <!-- 安装本 Demo 的依赖后，直接加载 Vue 的浏览器版本。 -->
    <script src="./node_modules/vue/dist/vue.global.js"></script>
    <style>
      body { max-width: 860px; margin: 40px auto; padding: 0 20px; font: 16px/1.7 sans-serif; }
      input, select, button { padding: 6px 10px; font: inherit; }
      label { display: inline-block; margin: 0 12px 12px 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
      pre { padding: 16px; background: #f4f4f4; overflow: auto; }
      [v-cloak] { display: none; }
    </style>
  </head>
  <body>
    <main id="app" v-cloak>
      <h1>商品列表：条件变，展示结果跟着变</h1>

      <!-- 第 4 步：v-model 把控件的值同步给对应的 ref。 -->
      <label>搜索 <input v-model="search" placeholder="试试：保湿" /></label>
      <label>素材
        <select v-model="materialFilter">
          <option value="all">全部商品</option>
          <option value="with-media">有素材</option>
          <option value="without-media">无素材</option>
        </select>
      </label>
      <label>排序
        <select v-model="sort">
          <option value="recent">最近更新</option>
          <option value="name">名称排序</option>
        </select>
      </label>
      <button @click="resetFilters">重置条件</button>

      <p>完整数据 {{ products.length }} 件，当前展示 {{ filteredProducts.length }} 件。</p>
      <!-- 第 5 步：模板读取计算结果，不自己实现筛选逻辑。 -->
      <table>
        <thead><tr><th>商品</th><th>描述</th><th>素材数</th><th>更新日期</th></tr></thead>
        <tbody>
          <tr v-for="product in filteredProducts" :key="product.id">
            <td>{{ product.name }}</td><td>{{ product.description }}</td>
            <td>{{ product.media.length }}</td><td>{{ product.updated_at }}</td>
          </tr>
        </tbody>
      </table>
      <p v-if="!filteredProducts.length">没有符合条件的商品，可以清空搜索或切换素材条件。</p>

      <details>
        <summary>观察原始列表：筛选和排序后，它的内容、顺序有没有改变？</summary>
        <pre>{{ JSON.stringify(products, null, 2) }}</pre>
      </details>
    </main>

    <script>
      const { createApp, ref, computed } = Vue;

      createApp({
        setup() {
          // 第 1 步：完整数据。用固定的演示数据代替接口返回值。
          const products = ref([
            { id: 1, name: '蓝牙音箱', description: '便携播放', selling_points: ['轻巧'], media: ['音箱.jpg'], updated_at: '2026-10-24' },
            { id: 2, name: '植物精华', description: '保湿护理', selling_points: ['清爽'], media: [], updated_at: '2026-10-26' },
            { id: 3, name: '身体乳', description: '日常护理', selling_points: ['保湿'], media: ['身体乳.jpg'], updated_at: '2026-10-25' },
          ]);

          // 第 2 步：条件。ref 保存会变化的值，在 JS 里通过 .value 读写。
          const search = ref('');
          const materialFilter = ref('all');
          const sort = ref('recent');

          // 第 3 步：计算展示列表。相关数据变化后，Vue 会在读取时更新计算结果。
          const filteredProducts = computed(() => {
            const keyword = search.value.trim().toLocaleLowerCase();

            // filter 返回一个新数组；false 表示不展示，并没有删除原始商品。
            const matchedProducts = products.value.filter((product) => {
              const text = [product.name, product.description, ...product.selling_points]
                .join(' ').toLocaleLowerCase();
              if (keyword && !text.includes(keyword)) return false;
              if (materialFilter.value === 'with-media') return product.media.length > 0;
              if (materialFilter.value === 'without-media') return product.media.length === 0;
              return true;
            });

            // sort 会修改调用它的数组；这里只排序 filter 产生的新数组。
            // 因此 products 的原始顺序不变。
            return matchedProducts.sort((left, right) => {
              if (sort.value === 'name') return left.name.localeCompare(right.name, 'zh-CN');
              return Date.parse(right.updated_at) - Date.parse(left.updated_at);
            });
          });

          function resetFilters() {
            search.value = '';
            materialFilter.value = 'all';
            sort.value = 'recent';
          }

          // setup 内的变量需要返回，模板才能使用；模板会自动解包 ref，无需写 .value。
          return { products, search, materialFilter, sort, filteredProducts, resetFilters };
        },
      }).mount('#app');
    </script>
  </body>
</html>
